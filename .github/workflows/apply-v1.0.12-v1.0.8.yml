name: Apply SCBL v1.0.12 and Server Tool v1.0.8 source

on:
  push:
    branches:
      - agent/release-v1.0.12-v1.0.8-host-latency-ui
    paths:
      - .github/scbl-v1.0.12-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.0.12-v1.0.8-host-latency-ui
          fetch-depth: 0

      - name: Apply reviewed host latency and UI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              write(path, updated)

          # Independent component versions.
          write("VERSION", "1.0.12\n")
          write("VERSION_CLIENT", "1.0.12\n")
          write("VERSION_SERVER_TOOL", "1.0.8\n")

          versions_path = Path("COMPONENT_VERSIONS.json")
          versions = json.loads(versions_path.read_text(encoding="utf-8"))
          versions["clientVersion"] = "1.0.12"
          versions["serverToolVersion"] = "1.0.8"
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "README.md",
              "> 当前 Windows 客户端：**v1.0.11**<br>\n> 当前 Linux 服务端工具：**v1.0.7**",
              "> 当前 Windows 客户端：**v1.0.12**<br>\n> 当前 Linux 服务端工具：**v1.0.8**",
          )
          replace_once(
              "README.md",
              "前往仓库的 Releases 页面，下载标题为 **[CLIENT] Windows Client v1.0.11** 的版本：",
              "前往仓库的 Releases 页面，下载标题为 **[CLIENT] Windows Client v1.0.12** 的版本：",
          )
          replace_once(
              "README.md",
              "SCBL-Client-v1.0.11-win-x86.zip",
              "SCBL-Client-v1.0.12-win-x86.zip",
          )

          changelog = read("CHANGELOG.md")
          heading = "# 更新记录\n\n"
          if not changelog.startswith(heading):
              raise SystemExit("CHANGELOG.md: unexpected heading")
          entry = """## Windows Client v1.0.12 / Server Tool v1.0.8

          - 房主状态栏改为延时与实际 EasyTier 底层线路展示，不再显示没有诊断价值的玩家数量。
          - 本机被权威确认为房主时持续测试到固定服务端的延时和 IPv4/IPv6、UDP/TCP/WSS 路径；加入他人房间时测试到房主的延时和路径。
          - “检测网络”按钮移动到连接状态标题行，状态正文独占下一行，避免较长的房主延时文字被按钮遮挡或过早截断。
          - 控制平面取消单人会话房主回退；普通线上大厅产生的个人会话不再误报“本机房主”，房主判断继续要求多人会话的服务端权威证据。
          - 玩家数量仍保留在在线玩家面板、控制平面响应和诊断快照中，但不再进入主状态栏。

          """
          write("CHANGELOG.md", heading + entry + changelog[len(heading):])

          # Keep the network-check action on the caption row and give the result its own line.
          xaml_status = """                <Border x:Name="bdStatusPanel" Background="{StaticResource CardLightBrush}"
                          BorderBrush="#243850"
                          BorderThickness="1"
                          CornerRadius="14"
                          Padding="12"
                          Margin="0,0,0,15">
                      <Grid>
                          <Grid.ColumnDefinitions>
                              <ColumnDefinition Width="Auto"/>
                              <ColumnDefinition Width="*"/>
                          </Grid.ColumnDefinitions>
                          <Grid.RowDefinitions>
                              <RowDefinition Height="Auto"/>
                              <RowDefinition Height="Auto"/>
                          </Grid.RowDefinitions>

                          <Border Grid.Column="0"
                                  Grid.RowSpan="2"
                                  Width="24"
                                  Height="24"
                                  Background="#0B141D"
                                  BorderBrush="#334961"
                                  BorderThickness="1"
                                  CornerRadius="12"
                                  Margin="0,0,10,0"
                                  VerticalAlignment="Center">
                              <Ellipse x:Name="serverStatusLight"
                                       Width="10"
                                       Height="10"
                                       Fill="Gray"
                                       HorizontalAlignment="Center"
                                       VerticalAlignment="Center"/>
                          </Border>

                          <Grid Grid.Column="1" Grid.Row="0">
                              <TextBlock x:Name="txtConnectionStatusCaption" Text="连接状态"
                                         Foreground="{StaticResource TextMutedBrush}"
                                         FontSize="10"
                                         VerticalAlignment="Center"/>
                              <Button x:Name="btnCheckNetwork"
                                      HorizontalAlignment="Right"
                                      MinWidth="74"
                                      Height="27"
                                      Padding="9,0"
                                      Content="↻ 检测网络"
                                      Style="{StaticResource SmallButton}"
                                      Click="CheckNetworkButton_Click"
                                      Margin="8,0,0,0"/>
                          </Grid>

                          <TextBlock x:Name="txtServerStatus"
                                     Grid.Column="1"
                                     Grid.Row="1"
                                     Text="未检测"
                                     Foreground="#D7E6F7"
                                     FontSize="13"
                                     FontWeight="SemiBold"
                                     Margin="0,2,0,0"
                                     TextWrapping="NoWrap"
                                     TextTrimming="CharacterEllipsis"/>
                      </Grid>
                  </Border>"""
          sub_once(
              "client/ScblPublicLauncher/MainWindow.xaml",
              r'                <Border x:Name="bdStatusPanel".*?                </Border>(?=\n\n                <TextBlock x:Name="txtLaunchModeLabel")',
              xaml_status,
              re.S,
          )

          replace_once(
              "client/ScblPublicLauncher/MainWindow.xaml.cs",
              '        btnCheckNetwork.Content = _networkCheckButtonCoolingDown\n            ? L("请稍后...", "Please wait...")\n            : L("检测网络", "Check Network");',
              '        btnCheckNetwork.Content = _networkCheckButtonCoolingDown\n            ? L("请稍后...", "Wait...")\n            : L("↻ 检测网络", "↻ Check");',
          )

          start_game_latency_monitor = r'''    private void StartGameLatencyMonitor()
          {
              if (_gameLatencyCts != null)
                  return;

              _gameLatencyActive = true;
              ResetGameQualityState();
              _localIsGameHost = false;
              _gamePeerIp = "";
              _lastGameLatencyMs = null;
              _lastGameTransport = "";
              _lastGameAddressFamily = "";
              _lastGameNextHop = "";
              _lastGameHopCount = null;
              _gameActivePeerCount = 0;
              _gameRoleSource = "";
              _gameHostUsername = "";
              _gameSessionId = null;
              RefreshServerStatusTextFromKind();
              _gameLatencyCts = new CancellationTokenSource();
              CancellationToken token = _gameLatencyCts.Token;
              _ = Task.Run(async () =>
              {
                  int missingCycles = 0;
                  DateTime lastPathQueryUtc = DateTime.MinValue;
                  string cachedPeerIp = "";
                  EasyTierPeerPath? cachedPath = null;

                  while (!token.IsCancellationRequested)
                  {
                      try
                      {
                          if (!_isGameStarting && !_isGameRunning)
                              break;

                          string bindIp = _assignedIp;
                          ControlPlaneGameSession? authoritative = null;
                          if (PublicTunnelConfig.IsScblClientIp(bindIp))
                          {
                              authoritative = await _controlPlaneService.GetGameSessionAsync(
                                  bindIp,
                                  GetControlPlaneSigningSecret(),
                                  token).ConfigureAwait(false);
                          }

                          bool authorityActive = authoritative?.Authoritative == true && authoritative.Active;
                          bool localHost = authorityActive && authoritative!.RequesterIsHost;
                          string hostIp = authorityActive ? authoritative!.HostVirtualIp.Trim() : "";
                          string hostUsername = authorityActive ? authoritative!.HostUsername.Trim() : "";
                          int activePeers = authorityActive ? authoritative!.ParticipantCount : 0;
                          string roleSource = authorityActive ? "game-server" : "";

                          if (localHost)
                          {
                              missingCycles = 0;
                              const string targetIp = PublicServerAddress;
                              if (!_gameQualityHostIp.Equals(targetIp, StringComparison.OrdinalIgnoreCase))
                                  ResetGameQualityState(targetIp);

                              bool shouldQueryPath = !targetIp.Equals(cachedPeerIp, StringComparison.OrdinalIgnoreCase)
                                  || cachedPath == null
                                  || (DateTime.UtcNow - lastPathQueryUtc).TotalSeconds >= 3;
                              if (shouldQueryPath)
                              {
                                  cachedPath = await _tunnelService.DetectPeerPathAsync(
                                      GetLauncherBaseDirectory(),
                                      targetIp,
                                      TimeSpan.FromMilliseconds(850)).ConfigureAwait(false);
                                  cachedPeerIp = targetIp;
                                  lastPathQueryUtc = DateTime.UtcNow;
                              }

                              (bool probeOk, long? probeLatency) = await TryOpenTcpConnectionAsync(
                                  PublicServerAddress,
                                  50051,
                                  TimeSpan.FromMilliseconds(700),
                                  bindIp).ConfigureAwait(false);
                              RecordGameQualitySample(probeOk, probeLatency);

                              EasyTierPeerPath? path = cachedPath;
                              long? currentLatency = probeLatency ?? path?.LatencyMs ?? _lastServerLatencyMs;
                              await Dispatcher.InvokeAsync(() =>
                              {
                                  string nextTransport = !string.IsNullOrWhiteSpace(path?.TransportMode) ? path.TransportMode : "";
                                  string nextFamily = path?.UnderlayAddressFamily ?? "";
                                  bool routeChanged = !_localIsGameHost
                                      || !_lastGameTransport.Equals(nextTransport, StringComparison.OrdinalIgnoreCase)
                                      || !_lastGameAddressFamily.Equals(nextFamily, StringComparison.OrdinalIgnoreCase)
                                      || _lastGameNextHop != (path?.NextHop ?? "")
                                      || _lastGameHopCount != path?.HopCount
                                      || _gameSessionId != authoritative!.SessionId;

                                  _gameLatencyActive = true;
                                  _localIsGameHost = true;
                                  _gameActivePeerCount = activePeers;
                                  _gamePeerIp = "";
                                  _lastGameLatencyMs = currentLatency;
                                  _lastGameTransport = nextTransport;
                                  _lastGameAddressFamily = nextFamily;
                                  _lastGameNextHop = path?.NextHop ?? "";
                                  _lastGameHopCount = path?.HopCount;
                                  _gameRoleSource = roleSource;
                                  _gameHostUsername = hostUsername;
                                  _gameSessionId = authoritative!.SessionId;
                                  if (currentLatency.HasValue)
                                      _lastServerLatencyMs = currentLatency;
                                  if (routeChanged)
                                  {
                                      LogService.Info($"Local host server path updated: source={roleSource}, session={_gameSessionId}, server={targetIp}, transport={_lastGameTransport}, underlay={_lastGameAddressFamily}, latency={_lastGameLatencyMs?.ToString() ?? "n/a"}ms, nextHop={_lastGameNextHop}, hops={_lastGameHopCount?.ToString() ?? "n/a"}.");
                                  }
                                  WriteGameQualitySnapshot();
                                  RefreshServerStatusTextFromKind();
                              });
                          }
                          else if (PublicTunnelConfig.IsScblClientIp(hostIp))
                          {
                              missingCycles = 0;
                              if (!_gameQualityHostIp.Equals(hostIp, StringComparison.OrdinalIgnoreCase))
                                  ResetGameQualityState(hostIp);

                              bool shouldQueryPath = !hostIp.Equals(cachedPeerIp, StringComparison.OrdinalIgnoreCase)
                                  || cachedPath == null
                                  || (DateTime.UtcNow - lastPathQueryUtc).TotalSeconds >= 3;
                              if (shouldQueryPath)
                              {
                                  cachedPath = await _tunnelService.DetectPeerPathAsync(
                                      GetLauncherBaseDirectory(),
                                      hostIp,
                                      TimeSpan.FromMilliseconds(850)).ConfigureAwait(false);
                                  cachedPeerIp = hostIp;
                                  lastPathQueryUtc = DateTime.UtcNow;
                              }

                              string probeUsername = await Dispatcher.InvokeAsync(() => GetCurrentPeerUsername());
                              _peerProbeService.StartOrUpdate(probeUsername, bindIp, LauncherVersion);
                              (bool probeOk, long? probeLatency) = await PeerProbeService.ProbeLatencyAsync(
                                  hostIp,
                                  TimeSpan.FromMilliseconds(700),
                                  token).ConfigureAwait(false);
                              RecordGameQualitySample(probeOk, probeLatency);

                              EasyTierPeerPath? path = cachedPath;
                              long? registryLatency = _lastPeers
                                  .FirstOrDefault(p => p.VirtualIp.Equals(hostIp, StringComparison.OrdinalIgnoreCase))
                                  ?.LatencyMs;
                              long? currentLatency = probeLatency ?? path?.LatencyMs ?? registryLatency;

                              await Dispatcher.InvokeAsync(() =>
                              {
                                  string nextTransport = !string.IsNullOrWhiteSpace(path?.TransportMode) ? path.TransportMode : "";
                                  string nextFamily = path?.UnderlayAddressFamily ?? "";
                                  bool routeChanged = !_gamePeerIp.Equals(hostIp, StringComparison.OrdinalIgnoreCase)
                                      || _localIsGameHost
                                      || !_lastGameTransport.Equals(nextTransport, StringComparison.OrdinalIgnoreCase)
                                      || !_lastGameAddressFamily.Equals(nextFamily, StringComparison.OrdinalIgnoreCase)
                                      || _lastGameNextHop != (path?.NextHop ?? "")
                                      || _lastGameHopCount != path?.HopCount
                                      || _gameSessionId != authoritative?.SessionId;

                                  _gameLatencyActive = true;
                                  _localIsGameHost = false;
                                  _gameActivePeerCount = activePeers;
                                  _gamePeerIp = hostIp;
                                  _lastGameLatencyMs = currentLatency;
                                  _lastGameTransport = nextTransport;
                                  _lastGameAddressFamily = nextFamily;
                                  _lastGameNextHop = path?.NextHop ?? "";
                                  _lastGameHopCount = path?.HopCount;
                                  _gameRoleSource = roleSource;
                                  _gameHostUsername = hostUsername;
                                  _gameSessionId = authoritative?.SessionId;
                                  if (routeChanged)
                                  {
                                      LogService.Info($"Game host path updated: source={roleSource}, session={_gameSessionId?.ToString() ?? "n/a"}, host={hostUsername}, peer={hostIp}, players={activePeers}, transport={_lastGameTransport}, underlay={_lastGameAddressFamily}, latency={_lastGameLatencyMs?.ToString() ?? "n/a"}ms, p50={_gameLatencyP50Ms?.ToString() ?? "n/a"}, p95={_gameLatencyP95Ms?.ToString() ?? "n/a"}, jitter={_gameJitterMs?.ToString() ?? "n/a"}, loss={_gameLossPercent?.ToString("0.0") ?? "n/a"}%, nextHop={_lastGameNextHop}, hops={_lastGameHopCount?.ToString() ?? "n/a"}.");
                                  }
                                  WriteGameQualitySnapshot();
                                  RefreshServerStatusTextFromKind();
                              });
                          }
                          else if (activePeers > 0)
                          {
                              missingCycles = 0;
                              await Dispatcher.InvokeAsync(() =>
                              {
                                  _gameLatencyActive = true;
                                  _localIsGameHost = false;
                                  _gameActivePeerCount = activePeers;
                                  _gamePeerIp = "";
                                  _lastGameLatencyMs = null;
                                  _lastGameTransport = "";
                                  _lastGameAddressFamily = "";
                                  _lastGameNextHop = "";
                                  _lastGameHopCount = null;
                                  _gameRoleSource = roleSource;
                                  _gameHostUsername = hostUsername;
                                  _gameSessionId = authoritative?.SessionId;
                                  WriteGameQualitySnapshot();
                                  RefreshServerStatusTextFromKind();
                              });
                          }
                          else if (++missingCycles >= 2)
                          {
                              await Dispatcher.InvokeAsync(() =>
                              {
                                  _gameLatencyActive = true;
                                  _localIsGameHost = false;
                                  _gameActivePeerCount = 0;
                                  _gamePeerIp = "";
                                  _lastGameLatencyMs = null;
                                  _lastGameTransport = "";
                                  _lastGameAddressFamily = "";
                                  _lastGameNextHop = "";
                                  _lastGameHopCount = null;
                                  _gameRoleSource = authorityActive ? "game-server" : "";
                                  _gameHostUsername = "";
                                  _gameSessionId = null;
                                  WriteGameQualitySnapshot();
                                  RefreshServerStatusTextFromKind();
                              });
                          }
                      }
                      catch (OperationCanceledException)
                      {
                          break;
                      }
                      catch (Exception ex)
                      {
                          LogService.Info("Game path monitor skipped one cycle: " + ex.Message);
                      }

                      try
                      {
                          await Task.Delay(TimeSpan.FromSeconds(2), token).ConfigureAwait(false);
                      }
                      catch (OperationCanceledException)
                      {
                          break;
                      }
                  }
              }, token);
          }

          '''
          sub_once(
              "client/ScblPublicLauncher/MainWindow.xaml.cs",
              r'    private void StartGameLatencyMonitor\(\)\n    \{.*?(?=    private void ResetGameQualityState)',
              start_game_latency_monitor,
              re.S,
          )

          format_status = r'''    private string FormatServerStatusText(ServerStatusKind kind)
          {
              string normalText;
              if (_gameLatencyActive)
              {
                  string descriptor = FormatPathDescriptor(_lastGameAddressFamily, _lastGameTransport, _lastGameHopCount);
                  string pathSuffix = string.IsNullOrWhiteSpace(descriptor) ? "" : $" · {descriptor}";
                  if (_localIsGameHost)
                  {
                      normalText = _lastGameLatencyMs.HasValue
                          ? L($"本机房主 · 服务端延时 {_lastGameLatencyMs.Value}ms{pathSuffix}", $"Local host · Server latency {_lastGameLatencyMs.Value}ms{pathSuffix}")
                          : L("本机房主 · 正在检测服务端延时", "Local host · Checking server latency");
                  }
                  else if (!string.IsNullOrWhiteSpace(_gamePeerIp))
                  {
                      normalText = _lastGameLatencyMs.HasValue
                          ? L($"与房主延时 {_lastGameLatencyMs.Value}ms{pathSuffix}", $"Host latency {_lastGameLatencyMs.Value}ms{pathSuffix}")
                          : L("正在检测与房主延时", "Checking host latency");
                  }
                  else if (_gameActivePeerCount > 0)
                  {
                      normalText = L("正在识别房主路径", "Identifying host path");
                  }
                  else
                  {
                      normalText = L("游戏已启动 · 等待房主信息", "Game running · Waiting for host information");
                  }
              }
              else
              {
                  string descriptor = FormatPathDescriptor(_lastConnectionAddressFamily, _lastConnectionTransport, null);
                  normalText = L("连接成功", "Connected");
                  if (_lastServerLatencyMs.HasValue)
                      normalText += L($" · 服务端延时 {_lastServerLatencyMs.Value}ms", $" · Server latency {_lastServerLatencyMs.Value}ms");
                  if (!string.IsNullOrWhiteSpace(descriptor))
                      normalText += $" · {descriptor}";
              }

              return kind switch
              {
                  ServerStatusKind.NetworkCreating => L("网络准备中", "Preparing network"),
                  ServerStatusKind.TunnelConnecting => L("网络连接中", "Connecting network"),
                  ServerStatusKind.ServerConnecting => L("服务连接中", "Connecting service"),
                  ServerStatusKind.TunnelReconnecting => L("网络重连中", "Reconnecting network"),
                  ServerStatusKind.Normal => normalText,
                  ServerStatusKind.NetworkFailed => L("网络创建失败", "Network creation failed"),
                  ServerStatusKind.TunnelFailed => L("网络连接失败", "Network connection failed"),
                  ServerStatusKind.ServerFailed => L("服务连接失败", "Service connection failed"),
                  _ => L("未检测", "Not checked")
              };
          }

          private string FormatPathDescriptor(string addressFamily, string transport, int? hopCount)
          {
              string family = (addressFamily ?? "").Trim();
              string mode = (transport ?? "").Trim();
              if (mode.Equals("udp", StringComparison.OrdinalIgnoreCase))
                  mode = "UDP";
              else if (mode.Equals("tcp", StringComparison.OrdinalIgnoreCase))
                  mode = "TCP";
              else if (mode.Equals("wss", StringComparison.OrdinalIgnoreCase))
                  mode = "WSS";

              if (IsEnglish)
              {
                  mode = mode
                      .Replace("多跳中继", "Relay", StringComparison.OrdinalIgnoreCase)
                      .Replace("多跳-", "Relay-", StringComparison.OrdinalIgnoreCase)
                      .Replace("UDP中继", "UDP Relay", StringComparison.OrdinalIgnoreCase);
              }

              if (string.IsNullOrWhiteSpace(family))
                  return mode;
              if (string.IsNullOrWhiteSpace(mode))
                  return family;
              return $"{family}/{mode}";
          }

          '''
          sub_once(
              "client/ScblPublicLauncher/MainWindow.xaml.cs",
              r'    private string FormatServerStatusText\(ServerStatusKind kind\)\n    \{.*?(?=    private void RefreshServerStatusTextFromKind)',
              format_status,
              re.S,
          )

          replace_once(
              "client/scbl-process-router/main.go",
              'routerVersion         = "1.0.11"',
              'routerVersion         = "1.0.12"',
          )

          # The control plane only reports a room when at least two participants with
          # two registered overlay addresses provide authoritative multiplayer evidence.
          replace_once(
              "server/scbl_control_plane.py",
              '_HOST_SESSION_CACHE: dict[str, AuthoritativeGameSession] = {}\n',
              '',
          )
          replace_once(
              "server/scbl_control_plane.py",
              'def _load_authoritative_sessions() -> tuple[dict[str, AuthoritativeGameSession], dict[str, AuthoritativeGameSession]]:\n    if not DB_PATH.exists():\n        return {}, {}',
              'def _load_authoritative_sessions() -> dict[str, AuthoritativeGameSession]:\n    if not DB_PATH.exists():\n        return {}',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '    result: dict[str, AuthoritativeGameSession] = {}\n    host_result: dict[str, AuthoritativeGameSession] = {}',
              '    result: dict[str, AuthoritativeGameSession] = {}',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '''        if not session.host_virtual_ip:
              continue
          current_host = host_result.get(session.host_virtual_ip)
          if current_host is None or session.score() > current_host.score():
              host_result[session.host_virtual_ip] = session

          # A one-person or one-IP record is not enough evidence to decorate the
          # global multiplayer topology. Solo sessions remain available only to
          # their own host through /v1/game-session.
          if session.participant_count < 2 or len(session.participant_ips) < 2:
              continue''',
              '''        # A one-person or one-IP record can be the ordinary online lobby's
          # personal session. It is not enough evidence to declare a playable room.
          if not session.host_virtual_ip or session.participant_count < 2 or len(session.participant_ips) < 2:
              continue''',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '    return result, host_result',
              '    return result',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '''def refresh_game_session_snapshot() -> bool:
          global _SESSION_CACHE, _HOST_SESSION_CACHE, _SESSION_SNAPSHOT_AT_MS, _SESSION_SNAPSHOT_ERROR
          try:
              snapshot, host_snapshot = _load_authoritative_sessions()
          except Exception as exc:
              with _SESSION_LOCK:
                  _SESSION_SNAPSHOT_ERROR = clean_text(exc, 256)
              return False
          with _SESSION_LOCK:
              _SESSION_CACHE = snapshot
              _HOST_SESSION_CACHE = host_snapshot
              _SESSION_SNAPSHOT_AT_MS = utc_ms()
              _SESSION_SNAPSHOT_ERROR = ""
          return True''',
              '''def refresh_game_session_snapshot() -> bool:
          global _SESSION_CACHE, _SESSION_SNAPSHOT_AT_MS, _SESSION_SNAPSHOT_ERROR
          try:
              snapshot = _load_authoritative_sessions()
          except Exception as exc:
              with _SESSION_LOCK:
                  _SESSION_SNAPSHOT_ERROR = clean_text(exc, 256)
              return False
          with _SESSION_LOCK:
              _SESSION_CACHE = snapshot
              _SESSION_SNAPSHOT_AT_MS = utc_ms()
              _SESSION_SNAPSHOT_ERROR = ""
          return True''',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '''

          def requester_host_sessions_by_ip() -> dict[str, AuthoritativeGameSession]:
              with _SESSION_LOCK:
                  return dict(_HOST_SESSION_CACHE)
          ''',
              '',
          )
          replace_once(
              "server/scbl_control_plane.py",
              '    session = authoritative_sessions_by_ip().get(source_ip)\n    if session is None:\n        session = requester_host_sessions_by_ip().get(source_ip)',
              '    session = authoritative_sessions_by_ip().get(source_ip)',
          )

          # Regression tests: lobby sessions stay inactive; display focuses on latency/path.
          replace_once(
              "server/test_control_plane.py",
              '                -- A solo room for C must be visible only to its own host query.',
              '                -- A solo lobby/personal session for C must not be treated as a room.',
          )
          replace_once(
              "server/test_control_plane.py",
              '''        assert c["active"] is True
          assert c["sessionId"] == 42
          assert c["participantCount"] == 1
          assert c["requesterIsHost"] is True
          assert "10.66.0.8" not in control_plane.authoritative_sessions_by_ip()''',
              '''        assert c["active"] is False
          assert c["sessionId"] is None
          assert c["participantCount"] == 0
          assert c["requesterIsHost"] is False
          assert "10.66.0.8" not in control_plane.authoritative_sessions_by_ip()''',
          )
          replace_once(
              "server/test_control_plane.py",
              '        print("control-plane authoritative snapshot and HTTP lifecycle tests passed")',
              '        print("control-plane multiplayer evidence and HTTP lifecycle tests passed")',
          )

          replace_once("server/test_client_network_resilience.py", 'assert version == "1.0.11"', 'assert version == "1.0.12"')
          replace_once(
              "server/test_client_network_resilience.py",
              'diagnostic = Path("client/ScblPublicLauncher/Services/DiagnosticExportService.cs").read_text(encoding="utf-8")',
              'diagnostic = Path("client/ScblPublicLauncher/Services/DiagnosticExportService.cs").read_text(encoding="utf-8")\nxaml = Path("client/ScblPublicLauncher/MainWindow.xaml").read_text(encoding="utf-8")',
          )
          replace_once(
              "server/test_client_network_resilience.py",
              'assert "request.Headers.ConnectionClose = true;" in control',
              '''assert "request.Headers.ConnectionClose = true;" in control
          assert 'Content="↻ 检测网络"' in xaml
          assert 'Grid.RowSpan="2"' in xaml
          assert 'x:Name="txtServerStatus"' in xaml and 'TextWrapping="NoWrap"' in xaml
          assert "本机房主 · 服务端延时" in window
          assert "与房主延时" in window
          assert "游戏已启动 · 等待房主信息" in window
          assert '本机房主 · {_gameActivePeerCount}名玩家' not in window
          assert "TryOpenTcpConnectionAsync(\n                                  PublicServerAddress,\n                                  50051" in window
          assert 'return $"{family}/{mode}";' in window''',
          )

          replace_once("server/test_server_tool_runtime.py", 'assert version == "1.0.7"', 'assert version == "1.0.8"')
          replace_once(
              "server/test_server_tool_runtime.py",
              'assert "_listener_watchdog_loop" in control',
              '''assert "_listener_watchdog_loop" in control
          assert "_HOST_SESSION_CACHE" not in control
          assert "requester_host_sessions_by_ip" not in control
          assert "session.participant_count < 2" in control''',
          )

          Path("docs/releases/CLIENT_v1.0.12.md").write_text("""# Windows Client v1.0.12

          - 房主状态栏不再显示玩家数量，改为直接显示当前角色、延时和 EasyTier 实际底层线路，例如“本机房主 · 服务端延时 28ms · IPv6/UDP”或“与房主延时 42ms · IPv4/UDP”。
          - 本机被服务端权威确认为房主时，启动器测试到固定服务端 `10.66.0.1` 的 TCP 服务延时，并读取 EasyTier 路径中的 IPv4/IPv6、UDP/TCP/WSS 信息。
          - 加入其他玩家房间时，继续直接测试到房主虚拟 IP 的延时和路径；不会把普通客户端用作第三方中继。
          - “检测网络”按钮移动到连接状态标题行，检测结果独占下一行，较长的房主路径文字不再被按钮挤压。
          - 普通线上大厅显示“游戏已启动 · 等待房主信息”；配合 Server Tool v1.0.8，不再把单人个人会话误报为本机房主。

          本版本不恢复客户端本地猜房主、广播转换或单播扇出，也不会在游戏运行期间重启 EasyTier、重建虚拟网卡或更换 `10.66.0.x` 地址。
          """, encoding="utf-8")

          Path("docs/releases/SERVER_TOOL_v1.0.8.md").write_text("""# Server Tool v1.0.8

          - 控制平面取消“任意单人未销毁会话即本机房主”的回退逻辑，避免玩家只进入普通线上大厅时误报房主。
          - `/v1/game-session` 继续只使用游戏服务器数据库中的权威证据；房间状态要求至少两名参与者，并且至少存在两个不同的 `10.66.0.x` 注册地址。
          - 已确认的多人会话仍会正确区分本机房主和其他玩家房主，并继续返回参与者数量供在线玩家面板和诊断使用。
          - 不修改数据库结构、账号、密码、房间数据或 dedicated_server 二进制；Server Tool 在线升级仍保留配置、数据库、日志和菜单15诊断能力。

          由于游戏服务器当前没有可区分“单人房间等待界面”和“普通线上大厅个人会话”的独立权威字段，单人等待阶段不会宣称已识别房主；第二名玩家进入后才显示权威房主状态。
          """, encoding="utf-8")
          PY

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < VERSION_CLIENT)" = "1.0.12"
          test "$(tr -d '\r\n ' < VERSION_SERVER_TOOL)" = "1.0.8"
          grep -Fq 'routerVersion         = "1.0.12"' client/scbl-process-router/main.go
          grep -Fq 'Content="↻ 检测网络"' client/ScblPublicLauncher/MainWindow.xaml
          grep -Fq '本机房主 · 服务端延时' client/ScblPublicLauncher/MainWindow.xaml.cs
          grep -Fq '与房主延时' client/ScblPublicLauncher/MainWindow.xaml.cs
          ! grep -Fq '_HOST_SESSION_CACHE' server/scbl_control_plane.py
          bash -n server/install_public_server.sh
          bash -n server/scbl_server_diagnostics.sh
          bash -n scripts/install-server.sh
          python3 -m py_compile \
            server/scbl_control_plane.py \
            server/scbl_update_server.py \
            server/test_control_plane.py \
            server/test_update_server.py \
            server/test_ddns_go_native.py \
            server/test_release_manifest_routing.py \
            server/test_network_topology.py \
            server/test_client_update_restart.py \
            server/test_client_network_resilience.py \
            server/test_server_tool_runtime.py \
            server/test_server_diagnostics.py \
            server/test_client_security_regressions.py
          python3 server/test_control_plane.py
          python3 server/test_update_server.py
          python3 server/test_ddns_go_native.py
          python3 server/test_release_manifest_routing.py
          python3 server/test_network_topology.py
          python3 server/test_client_update_restart.py
          python3 server/test_client_network_resilience.py
          python3 server/test_server_tool_runtime.py
          python3 server/test_server_diagnostics.py
          python3 server/test_client_security_regressions.py
          (
            cd client/scbl-process-router
            test -z "$(gofmt -l .)"
            GOOS=windows GOARCH=amd64 go vet ./...
            GOOS=windows GOARCH=amd64 go test ./...
            GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -o /tmp/scbl-process-router.exe .
          )
          test -s /tmp/scbl-process-router.exe

      - name: Commit final release source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-v1.0.12-v1.0.8.yml \
            .github/scbl-v1.0.12-apply-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Release client v1.0.12 and Server Tool v1.0.8'
          git push origin HEAD:agent/release-v1.0.12-v1.0.8-host-latency-ui
