name: Cleanup SCBL v1.0.12 release source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cleanup-v1.0.12-source.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-v1.0.12-v1.0.8-host-latency-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.0.12-v1.0.8-host-latency-ui
          fetch-depth: 0

      - name: Cleanup generated whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          control_path = Path('server/scbl_control_plane.py')
          control = control_path.read_text(encoding='utf-8')
          control, count = re.subn(
              r"(?m)^\s*# A one-person or one-IP record can be the ordinary online lobby\\?'s\n\s*# personal session\. It is not enough evidence to declare a playable room\.$",
              "        # A one-person or one-IP record can be the ordinary online lobby's\n        # personal session. It is not enough evidence to declare a playable room.",
              control,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected generated control-plane comment count=1, found {count}')
          control = control.replace('    return True\ndef _session_refresh_loop', '    return True\n\n\ndef _session_refresh_loop', 1)
          control_path.write_text(control, encoding='utf-8')

          window_path = Path('client/ScblPublicLauncher/MainWindow.xaml.cs')
          window = window_path.read_text(encoding='utf-8')
          window = window.replace('        }, token);\n    }\n\n\n    private void ResetGameQualityState', '        }, token);\n    }\n\n    private void ResetGameQualityState', 1)
          window_path.write_text(window, encoding='utf-8')
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server/scbl_control_plane.py server/test_control_plane.py server/test_network_topology.py
          python3 server/test_control_plane.py
          python3 server/test_network_topology.py
          grep -Fq "        # A one-person or one-IP record can be the ordinary online lobby's" server/scbl_control_plane.py
          ! grep -Fq "                # A one-person or one-IP record" server/scbl_control_plane.py

      - name: Commit clean source and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-v1.0.12-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style: cleanup v1.0.12 release source'
          git push origin HEAD:agent/release-v1.0.12-v1.0.8-host-latency-ui
