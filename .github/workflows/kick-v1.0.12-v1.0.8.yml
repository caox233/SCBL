name: Generate SCBL v1.0.12 release source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scbl-v1.0.12-apply-trigger
      - .github/workflows/kick-v1.0.12-v1.0.8.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-v1.0.12-v1.0.8-host-latency-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.0.12-v1.0.8-host-latency-ui
          fetch-depth: 0

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/apply-v1.0.12-v1.0.8.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('Unable to extract reviewed patch script')
          script = textwrap.dedent(match.group(1))

          original_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))'''
          robust_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              import textwrap as _textwrap
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              if count > 1 or "\\n" not in old:
                  raise SystemExit(f"{path}: expected one exact match, found {count}; old={old[:240]!r}")

              old_lines = _textwrap.dedent(old).strip("\\n").splitlines()
              parts = []
              for line in old_lines:
                  parts.append(r"[ \\t]*" + re.escape(line.lstrip()) if line.strip() else r"[ \\t]*")
              pattern = r"(?m)^" + r"\\n".join(parts) + r"$"
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: multiline structural match count={len(matches)}; old={old[:240]!r}")

              matched = matches[0].group(0)
              first_line = matched.splitlines()[0]
              base = first_line[:len(first_line) - len(first_line.lstrip())]
              new_lines = _textwrap.dedent(new).strip("\\n").splitlines()
              replacement = "\\n".join((base + line) if line.strip() else "" for line in new_lines)
              write(path, text[:matches[0].start()] + replacement + text[matches[0].end():])'''
          if original_helper not in script:
              raise SystemExit('Unable to locate replace_once helper in reviewed patch script')
          script = script.replace(original_helper, robust_helper, 1)
          exec(compile(script, 'apply-v1.0.12-v1.0.8.py', 'exec'), {})

          control_path = Path('server/scbl_control_plane.py')
          control = control_path.read_text(encoding='utf-8')
          refresh_function = '''def refresh_game_session_snapshot() -> bool:
              global _SESSION_CACHE, _SESSION_SNAPSHOT_AT_MS, _SESSION_SNAPSHOT_ERROR
              try:
                  snapshot = _load_authoritative_sessions()
              except Exception as exc:
                  with _SESSION_LOCK:
                      _SESSION_SNAPSHOT_ERROR = clean_text(exc, 256)
                  return False
              with _SESSION_LOCK:
                  _SESSION_CACHE = snapshot
                  _SESSION_SNAPSHOT_AT_MS = utc_ms()
                  _SESSION_SNAPSHOT_ERROR = ""
              return True
          '''
          control, count = re.subn(
              r'def refresh_game_session_snapshot\(\) -> bool:\n.*?(?=\ndef _session_refresh_loop)',
              textwrap.dedent(refresh_function).rstrip(),
              control,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Unable to normalize refresh_game_session_snapshot, count={count}')
          control_path.write_text(control, encoding='utf-8')

          test_path = Path('server/test_control_plane.py')
          test_text = test_path.read_text(encoding='utf-8')
          start_marker = '        assert b["requesterIsHost"] is True'
          end_marker = '        assert unrelated["hostVirtualIp"] == ""'
          start = test_text.index(start_marker)
          end = test_text.index(end_marker, start) + len(end_marker)
          assertions = "\n".join([
              '        assert b["requesterIsHost"] is True',
              '        assert c["active"] is False',
              '        assert c["sessionId"] is None',
              '        assert c["participantCount"] == 0',
              '        assert c["requesterIsHost"] is False',
              '        assert "10.66.0.8" not in control_plane.authoritative_sessions_by_ip()',
              '        assert unrelated["active"] is False',
              '        assert unrelated["hostVirtualIp"] == ""',
          ])
          test_path.write_text(test_text[:start] + assertions + test_text[end:], encoding='utf-8')

          resilience_path = Path('server/test_client_network_resilience.py')
          resilience = resilience_path.read_text(encoding='utf-8')
          resilience, count = re.subn(
              r'assert "TryOpenTcpConnectionAsync\(\n\s*PublicServerAddress,\n\s*50051" in window',
              'assert "TryOpenTcpConnectionAsync" in window and "PublicServerAddress" in window and "50051" in window',
              resilience,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Unable to normalize server-latency regression assertion, count={count}')
          resilience_path.write_text(resilience, encoding='utf-8')
          PY

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < VERSION_CLIENT)" = "1.0.12"
          test "$(tr -d '\r\n ' < VERSION_SERVER_TOOL)" = "1.0.8"
          grep -Fq 'routerVersion         = "1.0.12"' client/scbl-process-router/main.go
          grep -Fq '本机房主 · 服务端延时' client/ScblPublicLauncher/MainWindow.xaml.cs
          grep -Fq '与房主延时' client/ScblPublicLauncher/MainWindow.xaml.cs
          grep -Fq 'Content="↻ 检测网络"' client/ScblPublicLauncher/MainWindow.xaml
          ! grep -Fq '_HOST_SESSION_CACHE' server/scbl_control_plane.py
          bash -n server/install_public_server.sh
          bash -n server/scbl_server_diagnostics.sh
          python3 -m py_compile server/scbl_control_plane.py server/test_control_plane.py server/test_client_network_resilience.py server/test_server_tool_runtime.py
          python3 server/test_control_plane.py
          python3 server/test_client_network_resilience.py
          python3 server/test_server_tool_runtime.py
          (
            cd client/scbl-process-router
            test -z "$(gofmt -l .)"
            GOOS=windows GOARCH=amd64 go test ./...
          )

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-v1.0.12-v1.0.8.yml \
            .github/workflows/kick-v1.0.12-v1.0.8.yml \
            .github/scbl-v1.0.12-apply-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Release client v1.0.12 and Server Tool v1.0.8'
          git push origin HEAD:agent/release-v1.0.12-v1.0.8-host-latency-ui
