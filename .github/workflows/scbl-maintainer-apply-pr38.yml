name: SCBL apply validated release source

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .github/scbl-final2-apply-trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-v1.0.10-v1.0.6-final2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.0.10-v1.0.6-final2
          fetch-depth: 0

      - name: Import validated fix sources
        shell: bash
        run: |
          set -euo pipefail
          source_ref='agent/client-1.0.10-server-tool-1.0.6-diagnostics'
          git fetch --no-tags origin "$source_ref"
          for file in \
            .github/scbl_patch_client_core.py \
            .github/scbl_patch_redaction.py \
            .github/scbl_patch_part2.py \
            .github/scbl_patch_part3.py \
            .github/scbl_patch_part4.py; do
            git show "FETCH_HEAD:$file" > "/tmp/$(basename "$file")"
          done
          git show "FETCH_HEAD:server/scbl_server_diagnostics.sh" > server/scbl_server_diagnostics.sh
          chmod 0755 server/scbl_server_diagnostics.sh

      - name: Apply final source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/scbl_patch_client_core.py
          python3 /tmp/scbl_patch_redaction.py
          python3 /tmp/scbl_patch_part2.py
          python3 /tmp/scbl_patch_part3.py
          python3 /tmp/scbl_patch_part4.py
          sed -i 's/routerVersion         = "1.0.9"/routerVersion         = "1.0.10"/' client/scbl-process-router/main.go
          rm -f .github/scbl-final2-apply-trigger

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release client v1.0.10 and Server Tool v1.0.6'
          git push origin HEAD:agent/release-v1.0.10-v1.0.6-final2
