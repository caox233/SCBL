name: SCBL maintainer command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-pr39:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 39 &&
      github.event.comment.body == '/apply-scbl-pr39'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-1.0.10-server-tool-1.0.6-diagnostics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
          cache-dependency-path: client/scbl-process-router/go.sum
      - name: Apply source fixes
        run: |
          set -euo pipefail
          python3 .github/scbl_patch_client_core.py
          python3 .github/scbl_patch_redaction.py
          python3 .github/scbl_patch_part2.py
          python3 .github/scbl_patch_part3.py
          python3 .github/scbl_patch_part4.py
          sed -i 's/routerVersion         = "1.0.9"/routerVersion         = "1.0.10"/' client/scbl-process-router/main.go
      - name: Validate final source
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < VERSION_CLIENT)" = "1.0.10"
          test "$(tr -d '\r\n ' < VERSION_SERVER_TOOL)" = "1.0.6"
          grep -Fq 'routerVersion         = "1.0.10"' client/scbl-process-router/main.go
          bash -n server/install_public_server.sh
          bash -n server/scbl_server_diagnostics.sh
          bash -n scripts/install-server.sh
          python3 -m py_compile \
            server/scbl_control_plane.py \
            server/scbl_update_server.py \
            server/test_control_plane.py \
            server/test_update_server.py \
            server/test_ddns_go_native.py \
            server/test_release_manifest_routing.py \
            server/test_network_topology.py \
            server/test_client_update_restart.py \
            server/test_client_network_resilience.py \
            server/test_server_tool_runtime.py \
            server/test_server_diagnostics.py \
            server/test_client_security_regressions.py
          python3 server/test_control_plane.py
          python3 server/test_update_server.py
          python3 server/test_ddns_go_native.py
          python3 server/test_release_manifest_routing.py
          python3 server/test_network_topology.py
          python3 server/test_client_update_restart.py
          python3 server/test_client_network_resilience.py
          python3 server/test_server_tool_runtime.py
          python3 server/test_server_diagnostics.py
          python3 server/test_client_security_regressions.py
          cd client/scbl-process-router
          test -z "$(gofmt -l .)"
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go test ./...
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -o /tmp/scbl-process-router.exe .
          test -s /tmp/scbl-process-router.exe
      - name: Commit final source
        run: |
          set -euo pipefail
          rm -f .github/scbl_patch*.py \
            .github/workflows/scbl-apply-release-fixes.yml \
            .github/workflows/scbl-apply-release-fixes-v2.yml \
            .github/scbl_patch_error.txt \
            .github/scbl-pr38-apply-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release client v1.0.10 and Server Tool v1.0.6 diagnostics fixes'
          git push origin HEAD:agent/client-1.0.10-server-tool-1.0.6-diagnostics
