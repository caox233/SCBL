name: SCBL export final source after validation

on:
  workflow_run:
    workflows: ["Validate source"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  export-final-source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'agent/trigger-workflow-run-v1.0.10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.0.10-v1.0.6-final2
          fetch-depth: 0

      - name: Apply and export final source
        id: export
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/scbl-export.log) 2>&1
          set -e
          source_ref='agent/client-1.0.10-server-tool-1.0.6-diagnostics'
          git fetch --no-tags origin "$source_ref"
          for file in \
            .github/scbl_patch_client_core.py \
            .github/scbl_patch_redaction.py \
            .github/scbl_patch_part2.py \
            .github/scbl_patch_part3.py \
            .github/scbl_patch_part4.py; do
            git show "FETCH_HEAD:$file" > "/tmp/$(basename "$file")"
          done
          git show "FETCH_HEAD:server/scbl_server_diagnostics.sh" > server/scbl_server_diagnostics.sh
          chmod 0755 server/scbl_server_diagnostics.sh

          python3 /tmp/scbl_patch_client_core.py
          python3 /tmp/scbl_patch_redaction.py
          python3 /tmp/scbl_patch_part2.py
          python3 /tmp/scbl_patch_part3.py
          python3 /tmp/scbl_patch_part4.py
          sed -i 's/routerVersion         = "1.0.9"/routerVersion         = "1.0.10"/' client/scbl-process-router/main.go
          rm -f \
            .github/scbl-final2-apply-trigger \
            .github/scbl-workflow-run-trigger

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release client v1.0.10 and Server Tool v1.0.6'
          git push --force origin HEAD:refs/tags/scbl-source-v1.0.10-v1.0.6-temp

      - name: Report export result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### SCBL final source export'
            echo
            echo 'Outcome: `${{ steps.export.outcome }}`'
            echo
            echo '```text'
            tail -120 /tmp/scbl-export.log 2>/dev/null || echo 'No export log was produced.'
            echo '```'
          } > /tmp/scbl-export-comment.md
          gh pr comment 43 --repo "$GITHUB_REPOSITORY" --body-file /tmp/scbl-export-comment.md

      - name: Fail when export failed
        if: steps.export.outcome != 'success'
        run: exit 1
