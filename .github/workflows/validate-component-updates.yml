name: Validate component updates

on:
  pull_request:
    paths:
      - "client/ScblPublicLauncher/**"
      - "client/build_launcher_incremental.ps1"
      - "server/scbl_component_manager.py"
      - "server/scbl_publish_hooks_bundle.py"
      - "server/scbl_invite_test_manager.py"
      - "server/test_component_manager.py"
      - "server/test_publish_hooks_bundle.py"
      - "server/test_invite_test_manager.py"
      - "server/scbl_server_diagnostics.sh"
      - "server/install_component_manager.sh"
      - "server/install_invite_test_menu.sh"
      - "server/install_public_server.sh"
      - "scripts/install-server.sh"
      - ".github/workflows/validate-component-updates.yml"
  push:
    branches:
      - main
    paths:
      - "client/ScblPublicLauncher/**"
      - "client/build_launcher_incremental.ps1"
      - "server/scbl_component_manager.py"
      - "server/scbl_publish_hooks_bundle.py"
      - "server/scbl_invite_test_manager.py"
      - "server/test_component_manager.py"
      - "server/test_publish_hooks_bundle.py"
      - "server/test_invite_test_manager.py"
      - "server/scbl_server_diagnostics.sh"
      - "server/install_component_manager.sh"
      - "server/install_invite_test_menu.sh"
      - "server/install_public_server.sh"
      - "scripts/install-server.sh"
      - ".github/workflows/validate-component-updates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and shell sources
        run: |
          python3 -m py_compile \
            server/scbl_component_manager.py \
            server/scbl_publish_hooks_bundle.py \
            server/scbl_invite_test_manager.py
          python3 -m unittest \
            server.test_component_manager \
            server.test_publish_hooks_bundle \
            server.test_invite_test_manager -v
          bash -n server/scbl_server_diagnostics.sh
          bash -n server/install_component_manager.sh
          bash -n server/install_invite_test_menu.sh
          bash -n server/install_public_server.sh
          bash -n scripts/install-server.sh
          python3 - server/install_public_server.sh <<'PYEOF'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          blocks = re.findall(r"<<'?(PYEOF_[A-Za-z0-9_]+)'?\n(.*?)\n\1", text, re.S)
          if not blocks:
              raise SystemExit('manager script has no embedded Python heredocs')
          for marker, source in blocks:
              compile(source, f'{path}:{marker}', 'exec')
          print(f'validated embedded Python heredocs: {len(blocks)}')
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: scbl-component-manager-linux
          path: |
            server/scbl_component_manager.py
            server/scbl_publish_hooks_bundle.py
            server/scbl_invite_test_manager.py
            server/install_component_manager.sh
            server/scbl_server_diagnostics.sh
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: scbl-invite-test-server-tool-linux
          path: |
            server/install_public_server.sh
            server/scbl_component_manager.py
            server/scbl_publish_hooks_bundle.py
            server/scbl_invite_test_manager.py
            server/install_component_manager.sh
            server/install_invite_test_menu.sh
            server/scbl_server_diagnostics.sh
          if-no-files-found: error
          retention-days: 14

  windows-launcher-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build launcher incrementally
        shell: powershell
        run: |
          ./client/build_launcher_incremental.ps1 -Fast -SkipRuntimeStop
      - uses: actions/upload-artifact@v4
        with:
          name: scbl-launcher-component-test-win-x86
          path: client/ScblPublicLauncher/publish-single/SplinterCellCNLauncher.exe
          if-no-files-found: error
          retention-days: 14
