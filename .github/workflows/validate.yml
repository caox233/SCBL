name: Validate source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scbl-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Route Guard changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          [[ -n "$base" ]] || base='${{ github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'router=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^(client/scbl-process-router/|\.github/workflows/validate\.yml$)'; then
            echo 'router=true' >> "$GITHUB_OUTPUT"
          else
            echo 'router=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate independent component versions
        shell: bash
        run: |
          set -euo pipefail
          client_version="$(tr -d '\r\n ' < VERSION_CLIENT)"
          server_version="$(tr -d '\r\n ' < VERSION_SERVER_TOOL)"
          [[ "$client_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$server_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq 'VERSION_CLIENT' client/SCBL.Version.props
          grep -Fq "routerVersion         = \"${client_version}\"" client/scbl-process-router/main.go
          grep -Fq 'read_server_tool_version' server/install_public_server.sh
          grep -Fq 'SCBLControlPlane/{SERVER_TOOL_VERSION}' server/scbl_control_plane.py
          python3 - "$client_version" "$server_version" <<'PY'
          import json, sys
          client_version, server_version = sys.argv[1:3]
          data = json.load(open('COMPONENT_VERSIONS.json', encoding='utf-8'))
          assert data['clientVersion'] == client_version
          assert data['serverToolVersion'] == server_version
          assert data['controlApiVersion'] == 1
          assert data['dedicatedServer']['repository'] == 'caox233/5th-echelon'
          assert data['dedicatedServer']['releaseTag'] == 'scbl-public-stable-latest'
          PY
          ! grep -RIl $'\r' server .github docs scripts --include='*.sh' --include='*.py' --include='*.yml' --include='*.yaml'

      - name: Validate external Hooks ownership and embedded files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e client/hooks-source
          test ! -f client/ScblPublicLauncher/EmbeddedFiles/uplay_r1_loader.dll
          manifest=client/ScblPublicLauncher/EmbeddedFiles/SCBL_EMBEDDED_SHA256.txt
          test -f "$manifest"
          grep -Eq '^[0-9a-fA-F]{64}[[:space:]]+\*?uplay_r1_loader\.dll$' "$manifest"
          grep -Ev 'uplay_r1_loader\.dll$' "$manifest" | (cd client/ScblPublicLauncher/EmbeddedFiles && sha256sum -c -)

      - name: Validate server shell, Python and release routing
        shell: bash
        run: |
          set -euo pipefail
          bash -n server/install_public_server.sh
          bash -n server/scbl_server_diagnostics.sh
          bash -n scripts/install-server.sh
          bash -n scripts/maintenance/prune_component_releases.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          manager = Path('server/install_public_server.sh')
          for path in (manager, Path('scripts/install-server.sh')):
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r"<<'?(PYEOF_[A-Za-z0-9_]+)'?\n(.*?)\n\1", text, re.S)
              if path == manager and not blocks:
                  raise SystemExit(f'{path}: no embedded Python heredocs found')
              for marker, source in blocks:
                  compile(source, f'{path}:{marker}', 'exec')
          PY
          python3 -m py_compile server/scbl_control_plane.py server/scbl_update_server.py server/test_control_plane.py server/test_update_server.py server/test_ddns_go_native.py server/test_release_manifest_routing.py server/test_network_topology.py server/test_client_update_restart.py server/test_client_network_resilience.py server/test_server_tool_runtime.py server/test_server_diagnostics.py server/test_client_security_regressions.py
          python3 server/test_control_plane.py
          python3 server/test_update_server.py
          python3 server/test_ddns_go_native.py
          python3 server/test_release_manifest_routing.py
          python3 server/test_network_topology.py
          python3 server/test_client_update_restart.py
          python3 server/test_client_network_resilience.py
          python3 server/test_server_tool_runtime.py
          python3 server/test_server_diagnostics.py
          python3 server/test_client_security_regressions.py

      - name: Set up Go
        if: steps.changes.outputs.router == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
          cache-dependency-path: client/scbl-process-router/go.sum

      - name: Validate Go Route Guard
        if: steps.changes.outputs.router == 'true'
        working-directory: client/scbl-process-router
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          test -z "$(gofmt -l .)"
          GOOS=windows GOARCH=amd64 go vet .
          GOOS=windows GOARCH=amd64 go test .
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -o /tmp/scbl-process-router.exe .
          test -s /tmp/scbl-process-router.exe

  apply-client-v1-0-13:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/client-v1.0.13-embed-invite-hooks'
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      EXPECTED_HOOK_SHA256: c816b06d3f651de5b6ae17dd9dd548a396b4e9e55cb802b98aa4d8fd601abbca
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-v1.0.13-embed-invite-hooks
          fetch-depth: 0

      - name: Detect one-time trigger
        id: trigger
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.github/scbl-v1.0.13-embed-trigger') {
            'run=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'run=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Apply release metadata and expected Hooks hash
        if: steps.trigger.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $router = Get-Content -LiteralPath 'client/scbl-process-router/main.go' -Raw -Encoding UTF8
          $router = $router.Replace('routerVersion         = "1.0.12"', 'routerVersion         = "1.0.13"')
          if ($router -notmatch 'routerVersion\s+= "1\.0\.13"') { throw 'Route Guard version update failed.' }
          Set-Content -LiteralPath 'client/scbl-process-router/main.go' -Value $router -Encoding utf8NoBOM

          $manifestPath = 'client/ScblPublicLauncher/EmbeddedFiles/SCBL_EMBEDDED_SHA256.txt'
          $lines = @(Get-Content -LiteralPath $manifestPath -Encoding ASCII)
          $updated = foreach ($line in $lines) {
            if ($line -match '(?i)uplay_r1_loader\.dll\s*$') {
              "$env:EXPECTED_HOOK_SHA256  uplay_r1_loader.dll"
            } else {
              $line
            }
          }
          $updated | Set-Content -LiteralPath $manifestPath -Encoding ASCII

          $changelogPath = 'CHANGELOG.md'
          $changelog = Get-Content -LiteralPath $changelogPath -Raw -Encoding UTF8
          if ($changelog -notmatch '## Windows Client v1\.0\.13') {
            $entry = @"
## Windows Client v1.0.13

- 将邀请功能修复后的 `uplay_r1_loader.dll` 正式嵌入启动器单文件 EXE；启动游戏前由启动器从内置资源覆盖部署，避免旧 DLL 覆盖新邀请逻辑。
- 支持私人房间直接邀请与大厅组队邀请，增加中文 F5 接受界面，并修复大厅邀请异常导致游戏退出。
- API 轮询作为在线心跳，降低仍在大厅的好友被错误显示离线的问题。
- Linux Server Tool 保持 v1.0.8；dedicated server 继续使用独立滚动 Release。

"@
            $changelog = $changelog -replace '^# 更新记录\r?\n\r?\n', ("# 更新记录`r`n`r`n" + $entry)
            Set-Content -LiteralPath $changelogPath -Value $changelog -Encoding utf8NoBOM
          }

          $readmePath = 'README.md'
          $readme = Get-Content -LiteralPath $readmePath -Raw -Encoding UTF8
          $readme = $readme.Replace('Windows Client v1.0.12', 'Windows Client v1.0.13')
          Set-Content -LiteralPath $readmePath -Value $readme -Encoding utf8NoBOM

      - name: Build complete v1.0.13 package with current Hooks
        if: steps.trigger.outputs.run == 'true'
        shell: pwsh
        env:
          SCBL_5TH_REPOSITORY: caox233/5th-echelon
          SCBL_5TH_RELEASE_TAG: scbl-public-stable-latest
          SCBL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./client/build_all_windows.ps1 -Package -Clean
          if ($LASTEXITCODE -ne 0) { throw "Client build failed with exit code $LASTEXITCODE" }
          $dll = 'client/ScblPublicLauncher/EmbeddedFiles/uplay_r1_loader.dll'
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_HOOK_SHA256) {
            throw "Hooks hash mismatch. expected=$env:EXPECTED_HOOK_SHA256 actual=$actual"
          }
          if (!(Test-Path -LiteralPath 'client/dist/SCBL-Client-v1.0.13-win-x86.zip')) {
            throw 'SCBL Client v1.0.13 package was not generated.'
          }
          Write-Host "Embedded Hooks SHA256=$actual"

      - name: Commit validated production source
        if: steps.trigger.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/scbl-v1.0.13-embed-trigger' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/scbl-process-router/main.go client/ScblPublicLauncher/EmbeddedFiles/SCBL_EMBEDDED_SHA256.txt CHANGELOG.md README.md .github/scbl-v1.0.13-embed-trigger
          git diff --cached --check
          git commit -m 'release: finalize client v1.0.13 embedded Hooks metadata'
          git push origin HEAD:agent/client-v1.0.13-embed-invite-hooks
